name: Atualizar servidor (Supabase)
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'config/publico.json']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Projeto do Supabase
        id: ref
        run: |
          url=$(python3 -c "import json;print(json.load(open('config/publico.json')).get('supabaseUrl',''))")
          ref=$(echo "$url" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.(co|in)/?$#\1#p')
          [ -z "$ref" ] && ref="${{ vars.SUPABASE_PROJECT_REF }}"
          if [ -z "$ref" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            falta=""; [ -z "$ref" ] && falta="$falta endereço do Supabase (config/publico.json);"
            [ -z "$SUPABASE_ACCESS_TOKEN" ] && falta="$falta segredo SUPABASE_ACCESS_TOKEN;"
            [ -z "$SUPABASE_DB_PASSWORD" ] && falta="$falta segredo SUPABASE_DB_PASSWORD;"
            echo "::warning::Nada foi publicado. Falta:$falta"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.ref.outputs.ok == 'true'
        with: { version: latest }
      - if: steps.ref.outputs.ok == 'true'
        run: supabase link --project-ref ${{ steps.ref.outputs.ref }} -p "$SUPABASE_DB_PASSWORD"
      - name: Banco de dados
        if: steps.ref.outputs.ok == 'true'
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Chaves secretas das funções
        if: steps.ref.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          args=("SITE_URL=$(python3 -c "import json;print(json.load(open('config/publico.json'))['siteUrl'])")")
          for k in ANTHROPIC_API_KEY MP_ACCESS_TOKEN MP_WEBHOOK_SECRET; do [ -n "${!k}" ] && args+=("$k=${!k}"); done
          supabase secrets set --project-ref ${{ steps.ref.outputs.ref }} "${args[@]}"
      - name: Funções
        if: steps.ref.outputs.ok == 'true'
        run: |
          supabase functions deploy analisar --project-ref ${{ steps.ref.outputs.ref }}
          supabase functions deploy assinar --project-ref ${{ steps.ref.outputs.ref }}
          supabase functions deploy cancelar --project-ref ${{ steps.ref.outputs.ref }}
          supabase functions deploy mp-webhook --no-verify-jwt --project-ref ${{ steps.ref.outputs.ref }}
