name: Narração do tutorial
on:
  push:
    branches: [main]
    paths: ['tutorial/roteiro.json', 'tutorial/narrar.py']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  narrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install piper-tts==1.3.0
      - name: Baixar a voz pt_BR (faber, licença MIT / dados CC0)
        run: |
          mkdir -p voz
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium
          curl -sSfL -o voz/pt_BR-faber-medium.onnx $base/pt_BR-faber-medium.onnx
          curl -sSfL -o voz/pt_BR-faber-medium.onnx.json $base/pt_BR-faber-medium.onnx.json
      - run: python tutorial/narrar.py voz/pt_BR-faber-medium.onnx audio
      - name: Publicar as falas no ramo "narracao"
        run: |
          cd audio
          git init -q -b narracao
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Falas do tutorial (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" narracao
