name: Instalador para Windows
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão (tag) do release que vai receber o instalador, ex.: v0.6.0'
        required: true
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: python scripts/build.py desktop
      - name: Gerar instalador
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --config.nsis.artifactName=GabiaoCAD-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          files: desktop/dist/GabiaoCAD-Setup.exe
