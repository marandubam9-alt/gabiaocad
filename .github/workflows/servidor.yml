name: Atualizar servidor (Supabase)
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }} -p "$SUPABASE_DB_PASSWORD"
      - name: Banco de dados
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Chaves secretas das funções
        run: |
          supabase secrets set --project-ref ${{ vars.SUPABASE_PROJECT_REF }} \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            MP_ACCESS_TOKEN="${{ secrets.MP_ACCESS_TOKEN }}" \
            MP_WEBHOOK_SECRET="${{ secrets.MP_WEBHOOK_SECRET }}" \
            SITE_URL="${{ vars.SITE_URL }}"
      - name: Funções
        run: |
          supabase functions deploy analisar --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          supabase functions deploy assinar --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          supabase functions deploy cancelar --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          supabase functions deploy mp-webhook --no-verify-jwt --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
