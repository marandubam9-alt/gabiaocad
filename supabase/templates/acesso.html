<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#16212B">
  <h2 style="margin:0 0 12px">Seu código de acesso ao GabiãoCAD</h2>
  <p>Digite este código na tela de entrada do programa:</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:6px;background:#EEF2F4;border-radius:8px;padding:14px;text-align:center;margin:16px 0">{{ .Token }}</p>
  <p>Ou, se preferir, <a href="{{ .ConfirmationURL }}">clique aqui para entrar</a>.</p>

</div>
